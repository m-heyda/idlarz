name: CI

on:
  pull_request:
  push:
    branches: [main]
  # the full regeneration also runs every night on main: two PRs that are each fine alone can still leave the generated docs stale together
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# A new push to a PR cancels the run of the one before it (main and the nightly run are never cancelled).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The jobs run the PR's own code (npm scripts, tsx): read-only token, and the checkout does not keep it in .git/config.
permissions:
  contents: read

# What runs where (the slow work is done on your machine by `npm run verify`, see scripts/verify.ts, and CI checks that it was done):
#
#   every PR     lint (format, types, eslint), unit (tests) and build run side by side; `check` (the required check) waits for the three.
#                `generated` (required) recomputes the inputs hash of the generators (scripts/gen-inputs.ts: seconds) and fails when a file they read changed since the committed
#                docs/generated was written, then runs the pacing guard on the committed sim baseline against the one on the base branch.
#   main, nightly, a PR labelled `verify-generated`, a manual run
#                the full regeneration: `generate` shards the sims and reports (the slowest shard sets the time), `generated-full` merges them and fails when the committed
#                docs/generated differs from what was just generated. This is the net under the hash: it finds a hash written without really regenerating.

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npx tsc --noEmit
      - run: npm run lint

  unit:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the Next.js build cache: a build that only changed a few files reuses the rest
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build

  # The required check keeps its name: it is green when lint, unit and build are.
  check:
    needs: [lint, unit, build]
    if: ${{ always() && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: lint, unit and build must all have passed
        run: |
          echo "lint: ${{ needs.lint.result }}, unit: ${{ needs.unit.result }}, build: ${{ needs.build.result }}"
          [ "${{ needs.lint.result }}" = success ] && [ "${{ needs.unit.result }}" = success ] && [ "${{ needs.build.result }}" = success ]

  # The fast `generated` check (the required one): is docs/generated the output of THESE sources? (hash, no sims) and the pacing guard on the committed baseline.
  # A PR that changes what the generators read must have run `npm run docs:gen` (or `npm run verify`, which does it in parallel and writes the hash) and committed the result.
  generated:
    if: ${{ github.event_name != 'schedule' && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: docs/generated was written for these sources
        run: npx tsx scripts/gen-inputs.ts --check
      - name: Pacing guard against the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          PACING_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'pacing-change') }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          if ! git cat-file -e "origin/$BASE_REF:docs/generated/sim-baseline.json" 2>/dev/null; then
            echo "::notice::$BASE_REF has no docs/generated/sim-baseline.json yet (this PR introduces it): nothing to compare against"
            exit 0
          fi
          git show "origin/$BASE_REF:docs/generated/sim-baseline.json" > "$RUNNER_TEMP/base-baseline.json"
          # the label excuses violations only (--allow-violations); an unreadable file or a crash still fails the job.
          # Labels are read when the run starts: after adding `pacing-change`, push or reopen the PR (Re-run keeps the old labels).
          if [ "$PACING_CHANGE" = true ]; then
            npx tsx scripts/pacing-guard.ts --base="$RUNNER_TEMP/base-baseline.json" --allow-violations
          else
            npx tsx scripts/pacing-guard.ts --base="$RUNNER_TEMP/base-baseline.json"
          fi

  # The full regeneration (IDL-9, IDL-17). `npm run docs:gen` reruns every report, including the full sim, and the committed docs/generated must be exactly what it writes.
  # Two jobs: `generate` is a matrix that runs in parallel (the slow sim profile hardcore-rebirth6-x10 alone, about 5 minutes; every other sim profile; the other generators
  # in three groups) and uploads what each wrote; `generated-full` puts the shards together with `scripts/sim.ts --merge` (which fails if a profile is missing or twice) and
  # compares. The wall time is about the slowest shard plus the install, not the sum.
  generate:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'verify-generated') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # the long game: the one profile that takes about 5 minutes
          - shard: sim-x10
            command: npx tsx scripts/sim.ts --dump=shard/sim-x10.json hardcore-rebirth6-x10
          # every other profile (a new profile lands here on its own)
          - shard: sim-rest
            command: npx tsx scripts/sim.ts --dump=shard/sim-rest.json --except=hardcore-rebirth6-x10
          # the other generators, in three groups of about 3 minutes or less (the groups are the docs:gen:rest:* scripts in package.json)
          - shard: docs-quick
            command: npm run docs:gen:rest:quick
          - shard: docs-fights
            command: npm run docs:gen:rest:fights
          - shard: docs-loot
            command: npm run docs:gen:rest:loot
    name: generate (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: mkdir -p shard
      - name: Run the shard
        run: ${{ matrix.command }}
      - name: Pack what a generator shard wrote (only the files that differ from the checkout, so shards cannot overwrite each other)
        if: startsWith(matrix.shard, 'docs-')
        run: git ls-files --modified --others --exclude-standard docs/generated | tar -cf shard/docs.tar -T -
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: shard/
          if-no-files-found: error
          retention-days: 3

  generated-full:
    needs: generate
    # a failed or cancelled shard fails it in the first step
    if: ${{ !cancelled() && needs.generate.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: A shard must not have failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo '::error::a generate shard failed, see above'
          exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards
      - name: Put the shards together
        run: |
          # the sim shards: one flat folder of dumps, merged into sim-milestones.md and sim-baseline.json
          mkdir sim-dumps
          cp shards/shard-sim-*/*.json sim-dumps/
          # the other generators: the files each wrote go over the committed ones
          for t in shards/shard-docs-*/docs.tar; do tar -xf "$t"; done
          npx tsx scripts/sim.ts --merge=sim-dumps > /dev/null
      - name: Generated docs are up to date
        run: |
          git add -N docs/generated
          git diff --exit-code docs/generated || { echo '::error::docs/generated is stale: run npm run docs:gen (or npm run verify) and commit the result'; exit 1; }
      - name: The committed inputs hash matches the sources
        run: npx tsx scripts/gen-inputs.ts --check
      - name: Pacing guard against the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          PACING_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'pacing-change') }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          git show "origin/$BASE_REF:docs/generated/sim-baseline.json" > "$RUNNER_TEMP/base-baseline.json"
          if [ "$PACING_CHANGE" = true ]; then
            npx tsx scripts/pacing-guard.ts --base="$RUNNER_TEMP/base-baseline.json" --allow-violations
          else
            npx tsx scripts/pacing-guard.ts --base="$RUNNER_TEMP/base-baseline.json"
          fi
