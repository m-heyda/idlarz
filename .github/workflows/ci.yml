name: CI

on:
  pull_request:
  push:
    branches: [main]
  # the full regeneration also runs every night on main: two PRs that are each fine alone can still leave the generated docs stale together
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# A new push to a PR cancels the run of the one before it (main and the nightly run are never cancelled).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The jobs run the PR's own code (npm scripts, tsx): read-only token, and the checkout does not keep it in .git/config.
permissions:
  contents: read

# What runs where. The slow work (the sims and reports behind docs/generated) is done on your machine by `npm run verify` (scripts/verify.ts, also the pre-push hook), which writes
# docs/generated/inputs.sha256: a hash of every file the generators read (scripts/gen-inputs.ts). CI uses it as a shortcut:
#
#   lint, unit, build    run side by side on every PR and push; `check` (the required check) is green when all three are.
#   hash                 recomputes the inputs hash (seconds). Fresh = docs/generated was written for exactly these sources.
#   generate             the full regeneration, sharded (the slowest shard sets the time). It runs when the hash is NOT fresh (a PR that did not run docs:gen, or main moved under it:
#                        then it is the proof as before), on every push to main, every night, on a manual run and on a PR labelled `verify-generated`.
#   generated            (required) waits for the shards, puts them together, fails when the committed docs/generated differs from what was just generated, then runs the pacing
#                        guard on the baseline against the base branch's. With a fresh hash and no shards it only runs the guard (about a minute in all).
#
# So a PR that only touches the UI or assets, or one whose author ran `npm run verify`, finishes in about the time of `check`. The full regeneration on main and nightly
# is the net under the hash: it finds a hash that was written without really regenerating.

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npx tsc --noEmit
      - run: npm run lint

  unit:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the Next.js build cache: a build that only changed a few files reuses the rest
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build

  # The required check keeps its name: it is green when lint, unit and build are.
  check:
    needs: [lint, unit, build]
    if: ${{ always() && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: lint, unit and build must all have passed
        run: |
          echo "lint: ${{ needs.lint.result }}, unit: ${{ needs.unit.result }}, build: ${{ needs.build.result }}"
          [ "${{ needs.lint.result }}" = success ] && [ "${{ needs.unit.result }}" = success ] && [ "${{ needs.build.result }}" = success ]

  # Is docs/generated the output of THESE sources? (a hash, no sims)
  hash:
    runs-on: ubuntu-latest
    outputs:
      fresh: ${{ steps.hash.outputs.fresh }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inputs hash of the generators
        id: hash
        run: |
          if npx tsx scripts/gen-inputs.ts --check; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The inputs hash is stale (a file the generators read changed since the last npm run docs:gen, or main moved): running the full regeneration. Run npm run verify to avoid this next time."
          fi

  # The full regeneration (IDL-9, IDL-17). `npm run docs:gen` reruns every report, including the full sim, and the committed docs/generated must be exactly what it writes.
  # A matrix that runs in parallel (the slow sim profile hardcore-rebirth6-x10 alone, about 5 minutes; every other sim profile; the other generators in three groups); each shard uploads
  # what it wrote and `generated` puts them together with `scripts/sim.ts --merge` (which fails if a profile is missing or twice). The wall time is about the slowest shard plus the install.
  generate:
    needs: hash
    if: ${{ needs.hash.outputs.fresh != 'true' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'verify-generated') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # the long game: the one profile that takes about 5 minutes
          - shard: sim-x10
            command: npx tsx scripts/sim.ts --dump=shard/sim-x10.json hardcore-rebirth6-x10
          # every other profile (a new profile lands here on its own)
          - shard: sim-rest
            command: npx tsx scripts/sim.ts --dump=shard/sim-rest.json --except=hardcore-rebirth6-x10
          # the other generators, in three groups of about 3 minutes or less (the groups are the docs:gen:rest:* scripts in package.json)
          - shard: docs-quick
            command: npm run docs:gen:rest:quick
          - shard: docs-fights
            command: npm run docs:gen:rest:fights
          - shard: docs-loot
            command: npm run docs:gen:rest:loot
    name: generate (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: mkdir -p shard
      - name: Run the shard
        run: ${{ matrix.command }}
      - name: Pack what a generator shard wrote (only the files that differ from the checkout, so shards cannot overwrite each other)
        if: startsWith(matrix.shard, 'docs-')
        run: git ls-files --modified --others --exclude-standard docs/generated | tar -cf shard/docs.tar -T -
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: shard/
          if-no-files-found: error
          retention-days: 3

  generated:
    needs: [hash, generate]
    # runs on every event (and is green with a fresh hash and no shards); a failed or cancelled shard fails it in the first step
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: A shard (or the hash job) must not have failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo '::error::a generate shard or the hash job failed, see above'
          exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        if: needs.generate.result == 'success'
        with:
          pattern: shard-*
          path: shards
      - name: Put the shards together
        if: needs.generate.result == 'success'
        run: |
          # the sim shards: one flat folder of dumps, merged into sim-milestones.md and sim-baseline.json
          mkdir sim-dumps
          cp shards/shard-sim-*/*.json sim-dumps/
          # the other generators: the files each wrote go over the committed ones
          for t in shards/shard-docs-*/docs.tar; do tar -xf "$t"; done
          npx tsx scripts/sim.ts --merge=sim-dumps > /dev/null
      - name: Generated docs are up to date
        if: needs.generate.result == 'success'
        run: |
          git add -N docs/generated
          git diff --exit-code docs/generated || { echo '::error::docs/generated is stale: run npm run docs:gen (or npm run verify) and commit the result'; exit 1; }
          if [ "${{ needs.hash.outputs.fresh }}" != true ]; then
            echo "::notice::The regenerated docs equal the committed ones, only the inputs hash is stale: run npm run docs:gen:hash and commit docs/generated/inputs.sha256 to get the fast path next time."
          fi
      - name: Pacing guard against the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          PACING_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'pacing-change') }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          if ! git cat-file -e "origin/$BASE_REF:docs/generated/sim-baseline.json" 2>/dev/null; then
            echo "::notice::$BASE_REF has no docs/generated/sim-baseline.json yet (this PR introduces it): nothing to compare against"
            exit 0
          fi
          git show "origin/$BASE_REF:docs/generated/sim-baseline.json" > "$RUNNER_TEMP/base-baseline.json"
          # the label excuses violations only (--allow-violations); an unreadable file or a crash still fails the job.
          # Labels are read when the run starts: after adding `pacing-change`, push or reopen the PR (Re-run keeps the old labels).
          if [ "$PACING_CHANGE" = true ]; then
            npx tsx scripts/pacing-guard.ts --base="$RUNNER_TEMP/base-baseline.json" --allow-violations
          else
            npx tsx scripts/pacing-guard.ts --base="$RUNNER_TEMP/base-baseline.json"
          fi
