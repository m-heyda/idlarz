name: CI

on:
  pull_request:
  push:
    branches: [main]
  # the `generated` job also runs every night on main: two PRs that are each fine alone can still leave the generated docs stale together
  schedule:
    - cron: '17 3 * * *'

# A new push to a PR cancels the run of the one before it (main and the nightly run are never cancelled).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The jobs run the PR's own code (npm scripts, tsx): read-only token, and the checkout does not keep it in .git/config.
permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Generated docs and the pacing guard (IDL-9, IDL-17). `npm run docs:gen` reruns every report, including the full sim, and the committed
  # docs/generated must be exactly what it writes: a change to the game config or the sim that was not followed by `npm run docs:gen` fails
  # in `generated`. Then the sim baseline (docs/generated/sim-baseline.json) is compared with the copy on the branch the PR targets, so
  # regenerating the baseline cannot hide a pacing change: a guarded milestone (the first finish, the rebirths, castle 6/8/10, the level and
  # tile ladders) that moved by more than 15 % or 5 game days fails the PR. An intended change carries the `pacing-change` label (then
  # re-run the job): the guard still reports but does not block (a broken baseline file still does).
  #
  # It runs only when it can matter: on a PR only if the diff touches what the docs are generated from (src, scripts, docs/generated, the
  # lockfile, tsconfig, this workflow), not on a push to main (the PR already ran it) and every night.
  #
  # Three jobs: `scope` decides whether it matters; `generate` is a matrix that runs in parallel (the slow sim profile hardcore-rebirth6-x10
  # alone, about 5 minutes; every other sim profile; the other generators in three groups) and uploads what each wrote; `generated` (the required check)
  # puts the shards together with `scripts/sim.ts --merge` (which fails if a profile is missing or twice) and runs the two gates. The wall
  # time is about the slowest shard plus the install, not the sum.

  scope:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2 # on a PR the checkout is the merge commit: HEAD^1 is the base tip, so `git diff HEAD^1 HEAD` is the whole PR
      - name: Does this PR touch what the docs are generated from?
        id: scope
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || ! git rev-parse --verify -q HEAD^2 >/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^1 HEAD | grep -Eq '^(src/|scripts/|docs/generated/|package-lock.json$|package.json$|tsconfig.json$|.github/workflows/ci.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No change under src, scripts, docs/generated or the build files: the generated docs cannot differ, skipping."
          fi

  generate:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # the long game: the one profile that takes about 5 minutes
          - shard: sim-x10
            command: npx tsx scripts/sim.ts --dump=shard/sim-x10.json hardcore-rebirth6-x10
          # every other profile (a new profile lands here on its own)
          - shard: sim-rest
            command: npx tsx scripts/sim.ts --dump=shard/sim-rest.json --except=hardcore-rebirth6-x10
          # the other generators, in three groups of about 3 minutes or less (the groups are the docs:gen:rest:* scripts in package.json)
          - shard: docs-quick
            command: npm run docs:gen:rest:quick
          - shard: docs-fights
            command: npm run docs:gen:rest:fights
          - shard: docs-loot
            command: npm run docs:gen:rest:loot
    name: generate (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: mkdir -p shard
      - name: Run the shard
        run: ${{ matrix.command }}
      - name: Pack what a generator shard wrote (only the files that differ from the checkout, so shards cannot overwrite each other)
        if: startsWith(matrix.shard, 'docs-')
        run: git ls-files --modified --others --exclude-standard docs/generated | tar -cf shard/docs.tar -T -
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: shard/
          if-no-files-found: error
          retention-days: 3

  generated:
    needs: [scope, generate]
    # runs (and so reports green when everything was skipped) unless the PR is a push; a failed or cancelled shard fails it in the first step
    if: ${{ !cancelled() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: A shard must not have failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo '::error::a generate shard (or the scope job) failed, see above'
          exit 1
      - uses: actions/checkout@v4
        if: needs.scope.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: needs.scope.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - if: needs.scope.outputs.run == 'true'
        run: npm ci
      - uses: actions/download-artifact@v4
        if: needs.scope.outputs.run == 'true'
        with:
          pattern: shard-*
          path: shards
      - name: Put the shards together
        if: needs.scope.outputs.run == 'true'
        run: |
          # the sim shards: one flat folder of dumps, merged into sim-milestones.md and sim-baseline.json
          mkdir sim-dumps
          cp shards/shard-sim-*/*.json sim-dumps/
          # the other generators: the files each wrote go over the committed ones
          for t in shards/shard-docs-*/docs.tar; do tar -xf "$t"; done
          npx tsx scripts/sim.ts --merge=sim-dumps > /dev/null
      - name: Generated docs are up to date
        if: needs.scope.outputs.run == 'true'
        run: |
          git add -N docs/generated
          git diff --exit-code docs/generated || { echo '::error::docs/generated is stale: run npm run docs:gen and commit the result'; exit 1; }
      - name: Pacing guard against the base branch
        if: needs.scope.outputs.run == 'true' && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          PACING_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'pacing-change') }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          if ! git cat-file -e "origin/$BASE_REF:docs/generated/sim-baseline.json" 2>/dev/null; then
            echo "::notice::$BASE_REF has no docs/generated/sim-baseline.json yet (this PR introduces it): nothing to compare against"
            exit 0
          fi
          git show "origin/$BASE_REF:docs/generated/sim-baseline.json" > "$RUNNER_TEMP/base-baseline.json"
          # the label excuses violations only (--allow-violations); an unreadable file or a crash still fails the job
          if [ "$PACING_CHANGE" = true ]; then
            npx tsx scripts/pacing-guard.ts --base="$RUNNER_TEMP/base-baseline.json" --allow-violations
          else
            npx tsx scripts/pacing-guard.ts --base="$RUNNER_TEMP/base-baseline.json"
          fi
